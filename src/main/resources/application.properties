spring.application.name=github-proxy
spring.jpa.open-in-view=true

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=pass

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:liquibase/db.changelog-master.yaml
spring.cloud.openfeign.client.config.github.url=https://api.github.com
spring.cloud.openfeign.client.config.medical.url=http://localhost:8082

feign.circuitbreaker.alphanumeric-ids.enabled=true

logging.level.com.hubertkarw.github_proxy.feignClient = DEBUG